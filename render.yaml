services:
  - type: web
    name: exchange-management-system
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://exchange-management-system.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        value: rediss://default:gQAAAAAAAW9lAAIgcDExMWRmZjY2YzBkMmE0MjI5YTdkZWNhYzVjZDBiYTI5NQ@exact-prawn-94053.upstash.io:6379
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: receipts
